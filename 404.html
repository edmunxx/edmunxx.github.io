<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>404 — Page Not Found</title>
  <meta content="This page does not exist. Return to Edmundo Ferdinandus portfolio." name="description">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i|Playfair+Display:400,400i,500,500i,600,600i,700,700i&subset=cyrillic"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

  <style>
    .error-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .error-section h1 {
      font-size: 120px;
      font-weight: 700;
      color: #368aff;
      line-height: 1;
      margin-bottom: 20px;
    }
    .error-section h2 {
      font-size: 28px;
      color: #2c4964;
      margin-bottom: 15px;
    }
    .error-section p {
      color: #5a656e;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .error-section .btn-home {
      display: inline-block;
      padding: 12px 32px;
      background: #368aff;
      color: #fff;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
    }
    .error-section .btn-home:hover {
      background: #2678e8;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(54,138,255,0.3);
    }
  </style>
</head>

<body>
  <section class="error-section">
    <div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="btn-home"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </section>

  <!-- Vendor JS -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Theme Toggle -->
  <script>
    (function () {
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</body>

</html>
